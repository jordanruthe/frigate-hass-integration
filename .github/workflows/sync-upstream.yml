---
# Keeps this fork's client certificate / forward-auth patches on top of the
# latest upstream release and publishes <upstream tag>-mtls.<n> releases for
# HACS. Logic lives in .github/scripts/sync-upstream.sh.
#
# Needs secret RELEASE_TOKEN: fine-grained PAT for this repository with
# Contents, Issues and Workflows read/write. The rebase rewrites commits that
# touch workflow files, which GITHUB_TOKEN is not allowed to push.
name: Sync upstream and release

on:
  schedule:
    - cron: "43 5 * * *"
  push:
    branches:
      - master
  workflow_dispatch:

concurrency:
  group: sync-upstream

jobs:
  sync:
    runs-on: ubuntu-latest
    name: Sync and release
    env:
      GH_TOKEN: ${{ secrets.RELEASE_TOKEN }}
    steps:
      - name: Check for release token
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "::error::RELEASE_TOKEN secret is not set"
            exit 1
          fi

      - name: Check out the repository
        uses: actions/checkout@v5.0.0
        with:
          ref: master
          fetch-depth: 0
          token: ${{ secrets.RELEASE_TOKEN }}

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Rebase onto the latest upstream release
        id: rebase
        run: .github/scripts/sync-upstream.sh rebase

      - name: Determine release
        id: plan
        run: .github/scripts/sync-upstream.sh plan

      - name: Set up Python
        if: steps.plan.outputs.needed == 'true'
        uses: actions/setup-python@v5.6.0
        with:
          python-version: "3.13"

      - name: Install uv
        if: steps.plan.outputs.needed == 'true'
        uses: astral-sh/setup-uv@v6.4.3
        with:
          version: "0.6"

      - name: Run tests
        if: steps.plan.outputs.needed == 'true'
        run: |
          uv pip install -r requirements_dev.txt --system
          pytest -p no:sugar

      - name: Push rebased master
        if: steps.rebase.outputs.rebased == 'true'
        env:
          BEFORE: ${{ steps.rebase.outputs.before }}
        run: git push --force-with-lease="master:${BEFORE}" origin HEAD:master

      - name: Tag and publish release
        if: steps.plan.outputs.needed == 'true'
        env:
          TAG: ${{ steps.plan.outputs.tag }}
          BASE_TAG: ${{ steps.plan.outputs.base_tag }}
        run: .github/scripts/sync-upstream.sh publish
